[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "macp-mcp"
version = "0.1.0"
description = "MCP server that lets any MCP client run or join a MACP Decision session"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [
  {name = "Multi-Agent Coordination Protocol", email = "macp@multiagentcoordinationprotocol.org"}
]
keywords = ["mcp", "macp", "multi-agent", "coordination", "model-context-protocol"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  # The published MACP Python SDK: AsyncMacpClient + AsyncDecisionSession
  # (0.18.0) and the RFC-MACP-0013 commitment-hash verifier.
  "macp-sdk-python>=0.18.0,<0.19",
  # Official MCP Python SDK. 2.x renamed FastMCP to mcp.server.mcpserver.MCPServer;
  # this package is written against the 2.x API.
  "mcp>=2.3.0,<3",
  # TypedDict for tool results: pydantic rejects typing.TypedDict on 3.11.
  "typing-extensions>=4.12",
]

[project.scripts]
macp-mcp = "macp_mcp.__main__:main"

[project.urls]
Homepage = "https://multiagentcoordinationprotocol.io"
Repository = "https://github.com/multiagentcoordinationprotocol/macp-mcp"
Changelog = "https://github.com/multiagentcoordinationprotocol/macp-mcp/blob/main/CHANGELOG.md"
"Bug Tracker" = "https://github.com/multiagentcoordinationprotocol/macp-mcp/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "mypy>=1.10",
  "ruff>=0.5",
  "build>=1.0",
  "twine>=5.0",
  "jsonschema>=4.0",  # validates tool schemas/results against contract/tools.json
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["macp_mcp*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "ARG", "RET", "N", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ARG001", "ARG002", "ARG005", "N802", "N806"]

[tool.mypy]
packages = ["macp_mcp"]
mypy_path = "src"
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["macp.*", "grpc.*"]
ignore_missing_imports = true
ignore_errors = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
  "integration: requires a running MACP runtime (MACP_RUNTIME_TARGET)",
]
filterwarnings = [
  "error",
  "ignore::ResourceWarning",
]

[tool.coverage.run]
source = ["macp_mcp"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
